#-------------------------------------------------------------------------------
# Reusable workflow: Compile mean-field executables for nuclei calculations
#-------------------------------------------------------------------------------
name: Compile MF Nuclei

on:
  workflow_call:

permissions:
  contents: read
  packages: read

jobs:
  compile-gfortran:
    runs-on: ubuntu-latest
    container: ghcr.io/iaa-ulb/mocca-ci:latest
    strategy:
      matrix:
        CONFIG: [ LO, LO-P, LO-T, NLO, NLO-T, NLO-P, BXL, BXL-T, BXL-P, BXL-TP, N2LO, N2LO-T, N2LO-P, N2LO-TP, BXL-N2LO ]
        COMPILER: [ gfortran ]
        CALCTYPE: [ NUCLEI ]
        MPI: [ false ]
        OMP: [ false ]
        include:
          - CONFIG: LO
            COMPILER: gfortran
            CALCTYPE: NUCLEI
            MPI: false
            OMP: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Compile and upload
        uses: ./.github/actions/compile-and-upload
        with:
          target: mf
          config: ${{ matrix.CONFIG }}
          compiler: ${{ matrix.COMPILER }}
          calctype: ${{ matrix.CALCTYPE }}
          mpi: ${{ matrix.MPI }}
          omp: ${{ matrix.OMP }}
          compfam: 'gnu'
          hdf5suffix: '-hdf5'
          execname_prefix: 'MOCCa'

  compile-intel:
    runs-on: ubuntu-latest
    container: ghcr.io/iaa-ulb/mocca-ci-oneapi:latest
    strategy:
      matrix:
        include:
          # Intel OneAPI: NLO serial
          - CONFIG: NLO
            COMPILER: ifx
            CALCTYPE: NUCLEI
            MPI: false
          # Intel OneAPI: NLO mpi
          - CONFIG: NLO
            COMPILER: ifx
            CALCTYPE: NUCLEI
            MPI: true
          # Intel OneAPI: BXL mpi for parallel tests
          - CONFIG: BXL
            COMPILER: ifx
            CALCTYPE: NUCLEI
            MPI: true
          # Intel OneAPI: NLO-T serial for cranking tests
          - CONFIG: NLO-T
            COMPILER: ifx
            CALCTYPE: NUCLEI
            MPI: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Compile and upload
        uses: ./.github/actions/compile-and-upload
        with:
          target: mf
          config: ${{ matrix.CONFIG }}
          compiler: ${{ matrix.COMPILER }}
          calctype: ${{ matrix.CALCTYPE }}
          mpi: ${{ matrix.MPI }}
          compfam: 'intel'
          hdf5suffix: ''
          execname_prefix: 'MOCCa'
