#-------------------------------------------------------------------------------
# Reusable workflow: Compile FAM executables for nuclei calculations
#-------------------------------------------------------------------------------
name: Compile FAM Nuclei

on:
  workflow_call:

permissions:
  contents: read
  packages: read

jobs:
  compile-gfortran:
    runs-on: ubuntu-latest
    container: ghcr.io/iaa-ulb/mocca-ci:latest
    strategy:
      matrix:
        CONFIG: [ LO, LO-T, LO-P, NLO, NLO-T, NLO-P, BXL ]
        COMPILER: [ gfortran ]
        CALCTYPE: [ NUCLEI ]
        MPI: [ false ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Compile and upload
        uses: ./.github/actions/compile-and-upload
        with:
          target: fam
          config: ${{ matrix.CONFIG }}
          compiler: ${{ matrix.COMPILER }}
          calctype: ${{ matrix.CALCTYPE }}
          mpi: ${{ matrix.MPI }}
          compfam: 'gnu'
          hdf5suffix: ''
          execname_prefix: 'fam'

