#-------------------------------------------------------------------------------
# Reusable workflow: Compile FAM executables for nuclei calculations
#-------------------------------------------------------------------------------
name: Compile FAM Nuclei

on:
  workflow_call:

jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        CONFIG: [ LO, LO-T, LO-P, NLO, NLO-T, NLO-P, BXL ]
        COMPILER: [ gfortran ]
        CALCTYPE: [ NUCLEI ]
        MPI: [ false ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install build dependencies
        uses: ./.github/actions/install-build-deps

      - name: Compile and upload
        uses: ./.github/actions/compile-and-upload
        with:
          target: fam
          config: ${{ matrix.CONFIG }}
          compiler: ${{ matrix.COMPILER }}
          calctype: ${{ matrix.CALCTYPE }}
          mpi: ${{ matrix.MPI }}
          compfam: ${{ matrix.COMPILER == 'gfortran' && 'gnu' || 'intel' }}
          hdf5suffix: ''
          execname_prefix: 'fam'
