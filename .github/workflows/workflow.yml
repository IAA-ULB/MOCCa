#-------------------------------------------------------------------------------
# CI/CD deployment for MOCCa on github
#
# The logic of this workflow is simple:
# - the compile job creates all possible combinations of executables
# - ... and the following jobs run all defined tests using these executables.
#
# It is currently only verified to run on one or more of the astropc computers.
#
#-------------------------------------------------------------------------------
name: Tantalus CI/CD Workflow
#TODO:
# - add comments
# - clean up matrix notation
# - enable all options
on:
  push:
    branches:
      - mkdocs_documentation # configured for the testing branch right now
  pull_request:
    branches:
      - mkdocs_documentation # configured for the testing branch right now

jobs:
  compile:
    #------------------------------------------------------------------------------
    # Compile many different executables for different
    #   - CONFIG   = configuration file
    #   - COMPILER = different compiler
    #   - CALCTYPE = nuclei or pasta
    #------------------------------------------------------------------------------
    runs-on: self-hosted
    strategy:
      matrix:
        CONFIG:   [NLO, BXL, BXL-P, BXL-T, BXL-TP] # N2LO, N2LO-P, N2LO-T, N2LO-TP]
        COMPILER: [gfortran]                       # - ifort # TODO: fix on astropc19
        CALCTYPE: [NUCLEI]                         # - PASTA # TODO: fix the code
    env:
      # Uniquely labelling the executables with this environment variable
      SUFFIX: ${{ matrix.CONFIG }}.${{ matrix.COMPILER }}.${{ matrix.CALCTYPE }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare src directory
        # ---------------------------------------------------------------------------
        # This is a horrible hack:
        #   unfortunately the current Makefile configuration of Tantalus will always
        #   fail the first time around because Hephaestos has not created f90 files
        #   in the src/ directory yet. I have not found a way to correctly do this
        #   dependency in the Makefile yet...;
        # ---------------------------------------------------------------------------
        run: |
            mkdir src/
            cp src_orig/*.f90 src
      - name: Compile Tantalus
        # The setvers.sh ensures that the intel compilers are available on the astropcs
        run: |
          source /opt/intel/oneapi/setvars.sh --force &> /dev/null
          make CONFIG=${{ matrix.CONFIG }} COMPILER=${{ matrix.COMPILER }} EXENAME=Tantalus.${{ matrix.CONFIG }}.${{ matrix.COMPILER }}.${{ matrix.CALCTYPE }}.exe CALCTYPE=${{ matrix.CALCTYPE }}

      - name: Upload compilation artifact
        # Upload the executable such that next steps can download them!
        uses: actions/upload-artifact@v4
        with:
          name: exec-${{ env.SUFFIX }}
          path: exec/Tantalus.${{ env.SUFFIX }}.exe
          retention-days: 2

  minimal:
    #-----------------------------------------------------------------------------
    # Run the 'minimal' test for two different compilers.
    #-----------------------------------------------------------------------------
    runs-on: self-hosted
    needs:   compile
    strategy:
      matrix:
        COMPILER: [gfortran] # ifort # TODO: fix on astropc19
    env:
      SUFFIX: NLO.${{ matrix.COMPILER }}.NUCLEI
    steps:
      - uses: actions/download-artifact@v4
        # Start by downloading the relevant executable
        with:
          name: exec-${{ env.SUFFIX }}
          path: exec/

      - name: Make executeable
        # Unfortunately, github artifacts don't retain permissions.
        run:  chmod +x exec/Tantalus.${{ env.SUFFIX }}.exe

      - name: Run minimal test
        # Perform the test
        run: |
          cd testing/integration/
          bash minimal.sh $SUFFIX

      - name: Upload test results
        # Upload the log files as artefact
        uses: actions/upload-artifact@v4
        with:
          name: minimal-${{ env.SUFFIX }}
          path: testing/integration/logs/minimal.${{ env.SUFFIX }}.out
          retention-days: 90

