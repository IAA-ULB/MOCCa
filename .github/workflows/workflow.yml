            testing/integration/logs/fam_pairing_zero_mode.${{ env.SUFFIX_T }}.fam.out
          retention-days: 90

  fam_rotational_invariance:
    # Check that the strength has the proper symmetry properties
    runs-on: self-hosted
    needs: [compile-mf-nuclei, compile-fam-nuclei]
    strategy:
      matrix:
        CONFIG  : [ NLO]
        COMPILER: [ gfortran ]
        include :
          - CONFIG: NLO
            PARAM : SLy4
    env:
      # Uniquely labelling the executables with this environment variable
      SUFFIX    : ${{ matrix.CONFIG }}.${{ matrix.COMPILER }}.NUCLEI.SERIAL
    steps:
      # Ensure the testing scripts are available
      - name: Checkout code
        uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        # Download the mean-field executable
        with:
          name: MOCCa.${{ env.SUFFIX }}
          path: exec/

      # Download the FAM executables
      - uses: actions/download-artifact@v7
        with:
          name: fam.${{ env.SUFFIX }}
          path: exec/

      - name: Make executeable
        # Unfortunately, github artifacts don't retain permissions.
        run:  |
          chmod +x exec/MOCCa.${{ env.SUFFIX }}.exe
          chmod +x exec/fam.${{ env.SUFFIX }}.exe

      - name: Run the testing script (several times!)
        # Actually execute the test (source call to ensure MPIRUN is available)
        run: |
          cd testing/integration/
          source /opt/intel/oneapi/setvars.sh --force &> /dev/null
          bash fam_rotational_invariance.sh ${{ env.SUFFIX }}  ${{ matrix.PARAM }} HFB 2 1.0 --verbose

      - name: Upload test results
        if: success() || failure() # Always upload the code outputs
        uses: actions/upload-artifact@v7
        with:
          name: fam_strength_symmetry.${{ env.SUFFIX }}.logs
          path: |
            testing/integration/logs/fam_rotational_invariance.HFB.om=2.eta=1.0.${{ env.SUFFIX }}.${{ env.PARAM }}.out
            testing/integration/logs/fam_rotational_invariance.HFB.om=2.eta=1.0.${{ env.SUFFIX }}.${{ env.PARAM }}.fam.Q20.out
            testing/integration/logs/fam_rotational_invariance.HFB.om=2.eta=1.0.${{ env.SUFFIX }}.${{ env.PARAM }}.fam.Q22.out
          retention-days: 90
