        # Download the mean-field executable
        with:
          name: Tantalus.${{ env.SUFFIX }}
          path: exec/

      - uses: actions/download-artifact@v4
        # Download the FAM executable
        with:
          name: fam.${{ env.SUFFIX }}
          path: exec/

      - uses: actions/download-artifact@v4
        # Download the FAM executable
        with:
          name: fam.${{ env.SUFFIX_T }}
          path: exec/

      - uses: actions/download-artifact@v4
        # Download the FAM executable
        with:
          name: fam.${{ env.SUFFIX_P }}
          path: exec/

      - name: Make executeable
