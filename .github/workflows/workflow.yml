# Main Tantalus CI/CD Workflow
#
# This is the primary workflow that orchestrates:
#   1. Compilation of all executables (via reusable workflows)
#   2. Running all tests with proper dependencies
#
# The workflow is organized into stages:
#   Stage 1: Compilation (all jobs run in parallel)
#   Stage 2: Fast smoke tests (run after relevant compiles)
#   Stage 3: Integration tests (run after stage 2)
#   Stage 4: Heavy/long-running tests (run after stage 3)
#
# This replaces the original workflow.yml

name: Tantalus CI/CD

on:
  push:
    branches:
      - master
      - FAMQRPA
      - refactor_testing-vibe
  pull_request:
    branches:
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =============================================================================
  # STAGE 1: Compilation
  # All compile jobs run in parallel
  # =============================================================================

  compile-mf-nuclei:
    uses: ./.github/workflows/compile.yml
    with:
      config: ${{ matrix.CONFIG }}
      compiler: ${{ matrix.COMPILER }}
      calctype: NUCLEI
      mpi: ${{ matrix.MPI }}
      exe_prefix: Tantalus
      make_target: mf
    strategy:
      matrix:
        CONFIG: [ LO, NLO, NLO-T, BXL, BXL-T, BXL-P, BXL-TP, N2LO, N2LO-T, N2LO-P, N2LO-TP, BXL-N2LO ]
        COMPILER: [ gfortran ]
        MPI: [ false ]
        include:
          # Compiler independence checks with ifx
          - CONFIG: LO
            COMPILER: ifx
            MPI: false
          - CONFIG: NLO
            COMPILER: ifx
            MPI: false
          - CONFIG: BXL
            COMPILER: ifx
            MPI: false
          # MPI versions with ifx only (gfortran MPI not supported on astropcs)
          - CONFIG: NLO
            COMPILER: ifx
            MPI: true
          - CONFIG: BXL
            COMPILER: ifx
            MPI: true

  compile-mf-pasta:
    uses: ./.github/workflows/compile.yml
    with:
      config: ${{ matrix.CONFIG }}
      compiler: ${{ matrix.COMPILER }}
      calctype: PASTA
      mpi: ${{ matrix.MPI }}
      exe_prefix: Tantalus
      make_target: mf
    strategy:
      matrix:
        CONFIG: [ BXL ]
        COMPILER: [ gfortran, ifx ]
        MPI: [ false ]
        include:
          # MPI versions for PASTA
          - CONFIG: BXL
            COMPILER: ifx
            MPI: true

  compile-fam-nuclei:
    uses: ./.github/workflows/compile.yml
    with:
      config: ${{ matrix.CONFIG }}
      compiler: ${{ matrix.COMPILER }}
      calctype: NUCLEI
      mpi: ${{ matrix.MPI }}
      exe_prefix: fam
      make_target: fam
    strategy:
      matrix:
        CONFIG: [ LO, LO-T, LO-P, NLO, BXL ]
        COMPILER: [ gfortran, ifx ]
        MPI: [ false ]

  # =============================================================================
  # STAGE 2: Fast smoke tests
  # Run immediately after relevant compilation completes
  # =============================================================================

  minimal:
    runs-on: self-hosted
    needs: compile-mf-nuclei
    strategy:
      matrix:
        COMPILER: [ gfortran ]
    env:
      SUFFIX: NLO.${{ matrix.COMPILER }}.NUCLEI.SERIAL
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download executable
        uses: actions/download-artifact@v4
        with:
          name: Tantalus.${{ env.SUFFIX }}.exe
          path: exec/

      - name: Make executable
        run: chmod +x exec/Tantalus.${{ env.SUFFIX }}.exe

      - name: Run minimal test
        run: |
          cd testing/integration/
          source /opt/intel/oneapi/setvars.sh --force &> /dev/null
          bash minimal.sh $SUFFIX

      - name: Upload test results
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: minimal-${{ env.SUFFIX }}.logs
          path: testing/integration/logs/minimal.${{ env.SUFFIX }}.out
          retention-days: 90

  fission:
    runs-on: self-hosted
    needs: compile-mf-nuclei
    strategy:
      matrix:
        COMPILER: [ gfortran, ifx ]
    env:
      SUFFIX: BXL.${{ matrix.COMPILER }}.NUCLEI.SERIAL
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download executable
        uses: actions/download-artifact@v4
        with:
          name: Tantalus.${{ env.SUFFIX }}.exe
          path: exec/

      - name: Make executable
        run: chmod +x exec/Tantalus.${{ env.SUFFIX }}.exe

      - name: Run fission test
        run: |
          cd testing/integration/
          source /opt/intel/oneapi/setvars.sh --force &> /dev/null
          bash fission.sh $SUFFIX

      - name: Upload test results
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: fission-${{ env.SUFFIX }}.logs
          path: testing/integration/logs/fission.${{ env.SUFFIX }}.out
          retention-days: 90

  # =============================================================================
  # STAGE 3: Integration tests
  # Depend on stage 2 (fast tests) passing
  # =============================================================================

  boundary_conditions:
    runs-on: self-hosted
    needs: [compile-mf-nuclei, compile-mf-pasta, minimal, fission]
    strategy:
      matrix:
        COMPILER: [ ifx ]
    env:
      N_SUFFIX: BXL.${{ matrix.COMPILER }}.NUCLEI.SERIAL
      P_SUFFIX: BXL.${{ matrix.COMPILER }}.PASTA.SERIAL
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download nuclei executable
        uses: actions/download-artifact@v4
        with:
          name: Tantalus.${{ env.N_SUFFIX }}.exe
          path: exec/

      - name: Download pasta executable
        uses: actions/download-artifact@v4
        with:
          name: Tantalus.${{ env.P_SUFFIX }}.exe
          path: exec/

      - name: Make executables executable
        run: |
          chmod +x exec/Tantalus.${{ env.N_SUFFIX }}.exe
          chmod +x exec/Tantalus.${{ env.P_SUFFIX }}.exe

      - name: Run boundary conditions test
        run: |
          cd testing/integration/
          source /opt/intel/oneapi/setvars.sh --force &> /dev/null
          bash boundary_conditions.sh -p BSkG3_naked -e $N_SUFFIX -f $P_SUFFIX

      - name: Upload test results
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: boundary_conditions-${{ env.N_SUFFIX }}.logs
          path: |
            testing/integration/logs/boundary_conditions.${{ env.N_SUFFIX }}.out
            testing/integration/logs/boundary_conditions.${{ env.P_SUFFIX }}.out
          retention-days: 90

  continuation_wf:
    runs-on: self-hosted
    needs: [compile-mf-nuclei, minimal, fission]
    strategy:
      matrix:
        COMPILER: [ gfortran ]
        CONFIG: [ BXL, BXL-N2LO ]
        include:
          - CONFIG: BXL
            PARAM: BSkG3
          - CONFIG: BXL-N2LO
            PARAM: BSkG5
    env:
      SUFFIX: ${{ matrix.CONFIG }}.${{ matrix.COMPILER }}.NUCLEI.SERIAL
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download executable
        uses: actions/download-artifact@v4
        with:
          name: Tantalus.${{ env.SUFFIX }}.exe
          path: exec/

      - name: Make executable
        run: chmod +x exec/Tantalus.${{ env.SUFFIX }}.exe

      - name: Run continuation_wf test
        run: |
          cd testing/integration/
          source /opt/intel/oneapi/setvars.sh --force &> /dev/null
          bash continuation_wf.sh $SUFFIX ${{ matrix.PARAM }}

      - name: Upload test results
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: continuation_wf-${{ env.SUFFIX }}.logs
          path: |
            testing/integration/logs/continuation_wf.${{ env.SUFFIX }}.out.a
            testing/integration/logs/continuation_wf.${{ env.SUFFIX }}.out.b
          retention-days: 90

  continuation_hdf5:
    runs-on: self-hosted
    needs: [compile-mf-nuclei, minimal, fission]
    strategy:
      matrix:
        COMPILER: [ gfortran ]
        CONFIG: [ BXL, BXL-N2LO ]
        include:
          - CONFIG: BXL
            PARAM: BSkG3
          - CONFIG: BXL-N2LO
            PARAM: BSkG5
    env:
      SUFFIX: ${{ matrix.CONFIG }}.${{ matrix.COMPILER }}.NUCLEI.SERIAL
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download executable
        uses: actions/download-artifact@v4
        with:
          name: Tantalus.${{ env.SUFFIX }}.exe
          path: exec/

      - name: Make executable
        run: chmod +x exec/Tantalus.${{ env.SUFFIX }}.exe

      - name: Run continuation_hdf5 test
        run: |
          cd testing/integration/
          source /opt/intel/oneapi/setvars.sh --force &> /dev/null
          bash continuation_hdf5.sh $SUFFIX ${{ matrix.PARAM }}

      - name: Upload test results
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: continuation_hdf5-${{ env.SUFFIX }}.logs
          path: |
            testing/integration/logs/continuation_HDF5.${{ env.SUFFIX }}.out.a
            testing/integration/logs/continuation_HDF5.${{ env.SUFFIX }}.out.b
          retention-days: 90

  lattice_energy:
    runs-on: self-hosted
    needs: [compile-mf-nuclei, compile-mf-pasta, boundary_conditions, continuation_wf, continuation_hdf5]
    strategy:
      matrix:
        COMPILER: [ gfortran ]
        CONFIG: [ BXL ]
    env:
      SUFFIX_VAC: ${{ matrix.CONFIG }}.${{ matrix.COMPILER }}.NUCLEI.SERIAL
      SUFFIX_PAS: ${{ matrix.CONFIG }}.${{ matrix.COMPILER }}.PASTA.SERIAL
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download nuclei executable
        uses: actions/download-artifact@v4
        with:
          name: Tantalus.${{ env.SUFFIX_VAC }}.exe
          path: exec/

      - name: Download pasta executable
        uses: actions/download-artifact@v4
        with:
          name: Tantalus.${{ env.SUFFIX_PAS }}.exe
          path: exec/

      - name: Make executables executable
        run: |
          chmod +x exec/Tantalus.${{ env.SUFFIX_VAC }}.exe
          chmod +x exec/Tantalus.${{ env.SUFFIX_PAS }}.exe

      - name: Run lattice energy test
        run: |
          cd testing/integration/
          bash lattice_energy.sh -p BSkG4simpl -e ${{ env.SUFFIX_VAC }} -f ${{ env.SUFFIX_PAS }} -n 12

      - name: Upload test results
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: lattice_energy-${{ matrix.CONFIG }}.logs
          path: |
            testing/integration/logs/lattice_energy.${{ env.SUFFIX_VAC }}.out
            testing/integration/logs/lattice_energy.${{ env.SUFFIX_PAS }}.out
          retention-days: 90

  spaghetti:
    runs-on: self-hosted
    needs: [compile-mf-pasta, boundary_conditions]
    strategy:
      matrix:
        COMPILER: [ gfortran ]
        CONFIG: [ BXL ]
    env:
      SUFFIX: ${{ matrix.CONFIG }}.${{ matrix.COMPILER }}.PASTA.SERIAL
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download executable
        uses: actions/download-artifact@v4
        with:
          name: Tantalus.${{ env.SUFFIX }}.exe
          path: exec/

      - name: Make executable
        run: chmod +x exec/Tantalus.${{ env.SUFFIX }}.exe

      - name: Run spaghetti test
        run: |
          cd testing/integration/
          bash spag.sh ${{ env.SUFFIX }}

      - name: Upload test results
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: spaghetti-${{ env.SUFFIX }}.logs
          path: |
            testing/integration/logs/spag.${{ env.SUFFIX }}.out
            testing/integration/logs/spag.${{ env.SUFFIX }}.b.out
          retention-days: 90

  # =============================================================================
  # STAGE 4: Heavy/Parallel tests
  # Depend on stage 3 tests passing
  # =============================================================================

  parallel:
    runs-on: self-hosted
    needs: [compile-mf-nuclei, compile-mf-pasta, lattice_energy, spaghetti]
    strategy:
      matrix:
        COMPILER: [ ifx ]
        CONFIG: [ BXL, NLO ]
        include:
          - CONFIG: BXL
            PARAM: BSkG3
          - CONFIG: NLO
            PARAM: SLy4
    env:
      S_SUFFIX: ${{ matrix.CONFIG }}.${{ matrix.COMPILER }}.NUCLEI.SERIAL
      P_SUFFIX: ${{ matrix.CONFIG }}.${{ matrix.COMPILER }}.NUCLEI.MPI
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download serial executable
        uses: actions/download-artifact@v4
        with:
          name: Tantalus.${{ env.S_SUFFIX }}.exe
          path: exec/

      - name: Download parallel executable
        uses: actions/download-artifact@v4
        with:
          name: Tantalus.${{ env.P_SUFFIX }}.exe
          path: exec/

      - name: Make executables executable
        run: |
          chmod +x exec/Tantalus.${{ env.S_SUFFIX }}.exe
          chmod +x exec/Tantalus.${{ env.P_SUFFIX }}.exe

      - name: Run parallel test
        run: |
          cd testing/integration/
          source /opt/intel/oneapi/setvars.sh --force &> /dev/null
          bash parallel.sh -p ${{ matrix.PARAM }} -s $S_SUFFIX -m $P_SUFFIX -r 4 -q 8

      - name: Upload test results
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: parallel-${{ matrix.CONFIG }}.${{ matrix.COMPILER }}.logs
          path: |
            testing/integration/logs/serial.${{ env.S_SUFFIX }}.out
            testing/integration/logs/parallel_1.${{ env.P_SUFFIX }}.out
            testing/integration/logs/parallel_2.${{ env.P_SUFFIX }}.out
          retention-days: 90

  symmetries:
    runs-on: self-hosted
    needs: [compile-mf-nuclei, lattice_energy]
    strategy:
      matrix:
        CONFIG: [ BXL, N2LO ]
        COMPILER: [ gfortran ]
        include:
          - CONFIG: BXL
            PARAM: BSkG3
          - CONFIG: N2LO
            PARAM: SN2LO1
    env:
      EXEC: ${{ matrix.CONFIG }}.${{ matrix.COMPILER }}.NUCLEI.SERIAL
      EXEC_P: ${{ matrix.CONFIG }}-P.${{ matrix.COMPILER }}.NUCLEI.SERIAL
      EXEC_T: ${{ matrix.CONFIG }}-T.${{ matrix.COMPILER }}.NUCLEI.SERIAL
      EXEC_TP: ${{ matrix.CONFIG }}-TP.${{ matrix.COMPILER }}.NUCLEI.SERIAL
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download symmetric executable
        uses: actions/download-artifact@v4
        with:
          name: Tantalus.${{ env.EXEC }}.exe
          path: exec/

      - name: Download parity broken executable
        uses: actions/download-artifact@v4
        with:
          name: Tantalus.${{ env.EXEC_P }}.exe
          path: exec/

      - name: Download time-reversal broken executable
        uses: actions/download-artifact@v4
        with:
          name: Tantalus.${{ env.EXEC_T }}.exe
          path: exec/

      - name: Download TP-broken executable
        uses: actions/download-artifact@v4
        with:
          name: Tantalus.${{ env.EXEC_TP }}.exe
          path: exec/

      - name: Make executables executable
        run: |
          chmod +x exec/Tantalus.${{ env.EXEC }}.exe
          chmod +x exec/Tantalus.${{ env.EXEC_P }}.exe
          chmod +x exec/Tantalus.${{ env.EXEC_T }}.exe
          chmod +x exec/Tantalus.${{ env.EXEC_TP }}.exe

      - name: Run symmetries test
        run: |
          cd testing/integration/
          bash symmetries.sh ${{ matrix.PARAM }} ${{ env.EXEC }} ${{ env.EXEC_P }} ${{ env.EXEC_T }} ${{ env.EXEC_TP }}

      - name: Upload test results
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: symmetries-${{ matrix.PARAM }}-${{ matrix.CONFIG }}-${{ matrix.COMPILER }}.logs
          path: |
            testing/integration/logs/symmetries.${{ env.EXEC }}.out
            testing/integration/logs/symmetries.${{ env.EXEC_T }}.out
            testing/integration/logs/symmetries.${{ env.EXEC_P }}.out
            testing/integration/logs/symmetries.${{ env.EXEC_TP }}.out
          retention-days: 90

  # =============================================================================
  # FAM Tests - depend on both mf-nuclei and fam-nuclei compiles
  # =============================================================================

  fam_t0t3:
    runs-on: self-hosted
    needs: [compile-mf-nuclei, compile-fam-nuclei, spaghetti, symmetries]
    strategy:
      matrix:
        COMPILER: [ gfortran, ifx ]
    env:
      SUFFIX: LO.${{ matrix.COMPILER }}.NUCLEI.SERIAL
      SUFFIX_T: LO-T.${{ matrix.COMPILER }}.NUCLEI.SERIAL
      SUFFIX_P: LO-P.${{ matrix.COMPILER }}.NUCLEI.SERIAL
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download mean-field executable
        uses: actions/download-artifact@v4
        with:
          name: Tantalus.${{ env.SUFFIX }}.exe
          path: exec/

      - name: Download FAM executable (LO)
        uses: actions/download-artifact@v4
        with:
          name: fam.${{ env.SUFFIX }}.exe
          path: exec/

      - name: Download FAM executable (LO-T)
        uses: actions/download-artifact@v4
        with:
          name: fam.${{ env.SUFFIX_T }}.exe
          path: exec/

      - name: Download FAM executable (LO-P)
        uses: actions/download-artifact@v4
        with:
          name: fam.${{ env.SUFFIX_P }}.exe
          path: exec/

      - name: Make executables executable
        run: |
          chmod +x exec/Tantalus.${{ env.SUFFIX }}.exe
          chmod +x exec/fam.${{ env.SUFFIX }}.exe
          chmod +x exec/fam.${{ env.SUFFIX_T }}.exe
          chmod +x exec/fam.${{ env.SUFFIX_P }}.exe

      - name: Run fam_t0t3 test
        run: |
          cd testing/integration/
          source /opt/intel/oneapi/setvars.sh --force &> /dev/null
          bash fam_t0t3.sh $SUFFIX $SUFFIX_T $SUFFIX_P --verbose

      - name: Upload test results
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: fam_t0t3-${{ env.SUFFIX }}.logs
          path: |
            testing/integration/logs/fam_t0t3.${{ env.SUFFIX }}.out
            testing/integration/logs/fam_t0t3.${{ env.SUFFIX }}.out.bis
            testing/integration/logs/fam_t0t3.${{ env.SUFFIX }}.fam.out
            testing/integration/logs/fam_t0t3.${{ env.SUFFIX_T }}.fam.out
            testing/integration/logs/fam_t0t3.${{ env.SUFFIX_P }}.fam.out
          retention-days: 90

  fam_linearity:
    runs-on: self-hosted
    needs: [compile-mf-nuclei, compile-fam-nuclei, spaghetti, symmetries]
    strategy:
      matrix:
        COMPILER: [ gfortran, ifx ]
    env:
      SUFFIX: LO.${{ matrix.COMPILER }}.NUCLEI.SERIAL
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download mean-field executable
        uses: actions/download-artifact@v4
        with:
          name: Tantalus.${{ env.SUFFIX }}.exe
          path: exec/

      - name: Download FAM executable
        uses: actions/download-artifact@v4
        with:
          name: fam.${{ env.SUFFIX }}.exe
          path: exec/

      - name: Make executables executable
        run: |
          chmod +x exec/Tantalus.${{ env.SUFFIX }}.exe
          chmod +x exec/fam.${{ env.SUFFIX }}.exe

      - name: Run fam_linearity test
        run: |
          cd testing/integration/
          source /opt/intel/oneapi/setvars.sh --force &> /dev/null
          bash fam_linearity.sh --verbose ${{ env.SUFFIX }}

      - name: Upload test results
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: fam_linearity-${{ env.SUFFIX }}.logs
          path: |
            testing/integration/logs/fam_linearity.${{ env.SUFFIX }}.out
            testing/integration/logs/fam_linearity.${{ env.SUFFIX }}.out.bis
            testing/integration/logs/fam_linearity.${{ env.SUFFIX }}.fam.out
            testing/integration/logs/fam_linearity.${{ env.SUFFIX }}.fam.out.bis
            testing/integration/logs/qfam_linearity.${{ env.SUFFIX }}.out
            testing/integration/logs/qfam_linearity.${{ env.SUFFIX }}.out.bis
            testing/integration/logs/qfam_linearity.${{ env.SUFFIX }}.fam.out
            testing/integration/logs/qfam_linearity.${{ env.SUFFIX }}.fam.out.bis
          retention-days: 90

  gradient_vs_direct:
    runs-on: self-hosted
    needs: [compile-mf-nuclei, symmetries]
    strategy:
      matrix:
        CONFIG: [ BXL, NLO ]
        COMPILER: [ gfortran ]
        include:
          - CONFIG: BXL
            PARAM: BSkG3
          - CONFIG: NLO
            PARAM: SLy4
    env:
      SUFFIX: ${{ matrix.CONFIG }}.${{ matrix.COMPILER }}.NUCLEI.SERIAL
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download executable
        uses: actions/download-artifact@v4
        with:
          name: Tantalus.${{ env.SUFFIX }}.exe
          path: exec/

      - name: Make executable
        run: chmod +x exec/Tantalus.${{ env.SUFFIX }}.exe

      - name: Run gradient vs direct test
        run: |
          cd testing/integration/
          source /opt/intel/oneapi/setvars.sh --force &> /dev/null
          bash hfb_direct_gradient.sh -e $SUFFIX -p ${{ matrix.PARAM }}

      - name: Upload test results
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradient_vs_direct-${{ env.SUFFIX }}.logs
          path: |
            testing/integration/logs/directHFB.${{ env.SUFFIX }}.out
            testing/integration/logs/gradientHFB.${{ env.SUFFIX }}.out
          retention-days: 90

  cranking:
    runs-on: self-hosted
    needs: [compile-mf-nuclei, symmetries]
    strategy:
      matrix:
        CONFIG: [ NLO-T ]
        COMPILER: [ gfortran ]
    env:
      SUFFIX: ${{ matrix.CONFIG }}.${{ matrix.COMPILER }}.NUCLEI.SERIAL
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download executable
        uses: actions/download-artifact@v4
        with:
          name: Tantalus.${{ env.SUFFIX }}.exe
          path: exec/

      - name: Make executable
        run: chmod +x exec/Tantalus.${{ env.SUFFIX }}.exe

      - name: Run cranking test
        run: |
          cd testing/integration/
          source /opt/intel/oneapi/setvars.sh --force &> /dev/null
          bash cranking.sh $SUFFIX

      - name: Upload test results
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: cranking-${{ env.SUFFIX }}.logs
          path: |
            testing/integration/logs/cranking.${{ env.SUFFIX }}.out.J
            testing/integration/logs/cranking.${{ env.SUFFIX }}.out.omega
          retention-days: 90
