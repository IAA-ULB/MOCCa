    runs-on: self-hosted
    needs: [ compile-mf-nuclei, compile-mf-pasta ]
    strategy:
      matrix:
        COMPILER: [ ifx ]
        CONFIG:   [ BXL, NLO  ]
        include :
          - CONFIG: BXL
            PARAM : BSkG3
          - CONFIG: NLO
            PARAM : SLy4
    env:
      # Uniquely labelling the executables with this environment variable
      SUFFIX  : ${{ matrix.CONFIG }}.${{ matrix.COMPILER }}.NUCLEI
