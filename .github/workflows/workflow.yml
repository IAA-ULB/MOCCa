#-------------------------------------------------------------------------------
# CI/CD deployment for MOCCa on github
#
# The logic of this workflow is simple:
# - the compile job creates all possible combinations of executables
# - ... and the following jobs run all defined tests using these executables.
#
# It is currently only verified to run the astropc machines.
#
#-------------------------------------------------------------------------------
name: CI/CD
on:
  push:
    branches:
      - master
      - FAMQRPA
  pull_request:
    branches:
      - master
      - FAMQRPA
jobs:
  #-----------------------------------------------------------------------------
  # Compilation jobs
  compile-mf-nuclei:
    #------------------------------------------------------------------------------
    # Compile mean-field executables for different
    #   - CONFIG   = configuration file
    #   - COMPILER = different compiler
    #   - CALCTYPE = NUCLEI
    #------------------------------------------------------------------------------
    runs-on: self-hosted
    strategy:
      matrix:
        CONFIG     :   [ LO, LO-T, NLO, NLO-T, BXL, BXL-T,BXL-P,BXL-TP, N2LO,N2LO-T, N2LO-P,N2LO-TP, BXL-N2LO ]
        COMPILER   :   [ gfortran   ]
        CALCTYPE   :   [ NUCLEI     ]
        MPI        :   [ false]
        include :
            # Compile a few things with ifort to have a compiler independence check
            - CALCTYPE: NUCLEI 
              CONFIG  : LO
              COMPILER: ifx
              MPI     : false
            - CALCTYPE: NUCLEI
              CONFIG  : NLO
              COMPILER: ifx
              MPI     : false
            - CALCTYPE: NUCLEI
              CONFIG  : BXL
              COMPILER: ifx
              MPI     : false
            # Compile MPI versions with ifx only; gfortran MPI on the astropcs is not supported
            - CALCTYPE: NUCLEI 
              CONFIG  : NLO
              COMPILER: ifx
              MPI     : true
            - CALCTYPE: NUCLEI 
              CONFIG  : BXL
              COMPILER: ifx
              MPI     : true

    env:
      # Uniquely labelling the executables with this environment variable
      SUFFIX: ${{ matrix.CONFIG }}.${{ matrix.COMPILER }}.${{ matrix.CALCTYPE }}.${{ matrix.MPI && 'MPI'|| 'SERIAL' }}
      # Compiler family
      COMPFAM:  ${{ matrix.COMPILER == 'gfortran' && 'gnu' || 'intel' }}

      # There is not yet any intel HDF5 on astropc19, but enable it 
      #   by default for gfortran
      HDF5SUFFIX: ${{ matrix.COMPILER == 'gfortran' && '-hdf5'|| '' }}
      # MPI enabled
      MPISUFFIX: ${{ matrix.MPI && 'parallel'|| 'serial' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Prepare src directory
        # ---------------------------------------------------------------------------
        # This is a horrible hack:
        #   unfortunately the current Makefile configuration of MOCCa will always
        #   fail the first time around because Hephaestos has not created f90 files
        #   in the src/ directory yet. I have not found a way to correctly do this
        #   dependency in the Makefile yet...;
        # ---------------------------------------------------------------------------
        run: |
            mkdir src/
            mkdir src_fam/
            cp src_orig/*.f90 src/
            cp src_orig/*.f90 src_fam/
      - name: Compile MOCCa
        # 1. The setvars.sh ensures that the intel compilers are available on the astropcs
        # 2. The copy command ensures the right compilation options
        run: |
          source /opt/intel/oneapi/setvars.sh --force &> /dev/null
          cp make_include/make.inc.${{ env.COMPFAM }}-${{ env.MPISUFFIX }}${{ env.HDF5SUFFIX }} make.inc
          make mf CONFIG=${{ matrix.CONFIG }} EXENAME=MOCCa.${{ env.SUFFIX }}.exe CALCTYPE=${{ matrix.CALCTYPE }}

      - name: Upload compilation artifact
        # Upload the executable such that next steps can download them!
        uses: actions/upload-artifact@v7
        with:
          name: MOCCa.${{ env.SUFFIX }}
          path: exec/MOCCa.${{ env.SUFFIX }}.exe
          retention-days: 2
  compile-mf-pasta:
    #------------------------------------------------------------------------------
    # Compile mean-field executables for different
    #   - CONFIG   = BXL
    #   - COMPILER = gfortran, ifx
    #   - CALCTYPE = PASTA
    #   - MPI      = true/false  ! MPI = true not yet active for gfortran
    #------------------------------------------------------------------------------
    runs-on: self-hosted
    strategy:
      matrix:
        CONFIG     :   [ BXL ]
        COMPILER   :   [ gfortran, ifx ]
        CALCTYPE   :   [ PASTA         ] 
        MPI        :   [ false         ]
        include :
            # Compile a few things with ifort to have a compiler independence check
            - CALCTYPE: PASTA 
              CONFIG  : BXL 
              COMPILER: ifx
              MPI     : true
    env:
      # Uniquely labelling the executables with this environment variable
      SUFFIX: ${{ matrix.CONFIG }}.${{ matrix.COMPILER }}.${{ matrix.CALCTYPE }}.${{ matrix.MPI && 'MPI'|| 'SERIAL' }}
      # Compiler family
      COMPFAM:  ${{ matrix.COMPILER == 'gfortran' && 'gnu' || 'intel' }}
      # Enable HDF5 only for gfortran builds for the moment
      HDF5SUFFIX: ${{ matrix.COMPILER == 'gfortran' && '-hdf5'|| '' }}
      # MPI enabled
      MPISUFFIX: ${{ matrix.MPI && 'parallel'|| 'serial' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Prepare src directory
        # ---------------------------------------------------------------------------
        # This is a horrible hack:
        #   unfortunately the current Makefile configuration of MOCCa will always
        #   fail the first time around because Hephaestos has not created f90 files
        #   in the src/ directory yet. I have not found a way to correctly do this
        #   dependency in the Makefile yet...;
        # ---------------------------------------------------------------------------
        run: |
            mkdir src/
            mkdir src_fam/
            cp src_orig/*.f90 src/
            cp src_orig/*.f90 src_fam/
      - name: Compile MOCCa
        # 1. The setvars.sh ensures that the intel compilers are available on the astropcs
        # 2. The copy command ensures the right compilation options
        run: |
          source /opt/intel/oneapi/setvars.sh --force &> /dev/null
          cp make_include/make.inc.${{ env.COMPFAM }}-${{ env.MPISUFFIX }}${{ env.HDF5SUFFIX }} make.inc
          make mf  CONFIG=${{ matrix.CONFIG }} EXENAME=MOCCa.${{ env.SUFFIX }}.exe CALCTYPE=${{ matrix.CALCTYPE }}
      - name: Upload mean-field executable
        uses: actions/upload-artifact@v7
        with:
          name: MOCCa.${{ env.SUFFIX }}
          path: exec/MOCCa.${{ env.SUFFIX }}.exe
          retention-days: 2
  compile-fam-nuclei:
    #------------------------------------------------------------------------------
    # Compile FAM executables for different
    #   - CONFIG   = NLO
    #   - COMPILER = gfortran
    #   - CALCTYPE = NUCLEI
    #   - MPI      = false
    #------------------------------------------------------------------------------
    runs-on: self-hosted
    strategy:
      matrix:
        CONFIG     :  [ LO, LO-T, LO-P, NLO, NLO-T, NLO-P, BXL ]
        COMPILER   :  [ gfortran, ifx      ]
        CALCTYPE   :  [ NUCLEI             ]
        MPI        :  [ false              ]

    env:
      # Uniquely labelling the executables with this environment variable
      SUFFIX: ${{ matrix.CONFIG }}.${{ matrix.COMPILER }}.${{ matrix.CALCTYPE }}.${{ matrix.MPI && 'MPI'|| 'SERIAL' }}
      # Compiler family
      COMPFAM:  ${{ matrix.COMPILER == 'gfortran' && 'gnu' || 'intel' }}
      # Enable HDF5 only for gfortran builds for the moment
      HDF5SUFFIX: ${{ matrix.COMPILER == 'gfortran' && '-hdf5'|| '' }}
      # MPI enabled
      MPISUFFIX: ${{ matrix.MPI && 'parallel'|| 'serial' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Prepare src directory
        # ---------------------------------------------------------------------------
        # This is a horrible hack:
        #   unfortunately the current Makefile configuration of MOCCa will always
        #   fail the first time around because Hephaestos has not created f90 files
        #   in the src/ directory yet. I have not found a way to correctly do this
        #   dependency in the Makefile yet...;
        # ---------------------------------------------------------------------------
        run: |
            mkdir src/
            mkdir src_fam/
            cp src_orig/*.f90 src/
            cp src_orig/*.f90 src_fam/

      - name: Compile MOCCa
        # 1. The setvars.sh ensures that the intel compilers are available on the astropcs
        # 2. The copy command ensures the right compilation options
        run: |
          source /opt/intel/oneapi/setvars.sh --force &> /dev/null
          cp make_include/make.inc.${{ env.COMPFAM }}-${{ env.MPISUFFIX }}${{ env.HDF5SUFFIX }} make.inc
          make fam CONFIG=${{ matrix.CONFIG }} FAMNAME=fam.${{env.SUFFIX}}.exe CALCTYPE=${{ matrix.CALCTYPE }}
      - name: Upload FAM executable
        uses: actions/upload-artifact@v7
        with:
          name: fam.${{ env.SUFFIX }}
          path: exec/fam.${{ env.SUFFIX }}.exe
          retention-days: 2
  #-----------------------------------------------------------------------------
  # Actual test-running jobs
  minimal:
    #-----------------------------------------------------------------------------
    # Run the 'minimal' test for two different compilers.
    #-----------------------------------------------------------------------------
    runs-on: self-hosted
    needs:   compile-mf-nuclei
    strategy:
      matrix:
        COMPILER: [gfortran, ifx] # Reactivate
    env:
      SUFFIX: NLO.${{ matrix.COMPILER }}.NUCLEI.SERIAL
    steps:
      - name: Checkout code # needed to get the testing scripts
        uses: actions/checkout@v6

      - name: Download executable
        uses: actions/download-artifact@v7
        with:
          name: MOCCa.${{ env.SUFFIX }}
          path: exec/

      - name: Make executeable
        # Unfortunately, github artifacts don't retain permissions.
        run:  chmod +x exec/MOCCa.${{ env.SUFFIX }}.exe

      - name: Run minimal test
        # Perform the test
        run: |
          cd testing/integration/
          source /opt/intel/oneapi/setvars.sh --force &> /dev/null
          bash minimal.sh $SUFFIX

      - name: Upload test results
        # Upload the log files as artefact
        if: success() || failure() # Always upload the code outputs
        uses: actions/upload-artifact@v7
        with:
          name: minimal-${{ env.SUFFIX }}.logs
          path: testing/integration/logs/minimal.${{ env.SUFFIX }}.out
          retention-days: 90

  memory_leak:
    #-----------------------------------------------------------------------------
    # Run the 'minimal' test for two different compilers.
    #-----------------------------------------------------------------------------
    runs-on: self-hosted
    needs:   compile-mf-nuclei
    strategy:
      matrix:
        COMPILER: [gfortran, ifx] # Reactivate
    env:
      SUFFIX: NLO.${{ matrix.COMPILER }}.NUCLEI.SERIAL
    steps:
      - name: Checkout code # needed to get the testing scripts
        uses: actions/checkout@v6

      - name: Download executable
        uses: actions/download-artifact@v7
        with:
          name: MOCCa.${{ env.SUFFIX }}
          path: exec/

      - name: Make executeable
        # Unfortunately, github artifacts don't retain permissions.
        run:  chmod +x exec/MOCCa.${{ env.SUFFIX }}.exe

      - name: Run memory-leak test
        # Perform the test
        run: |
          cd testing/integration/
          source /opt/intel/oneapi/setvars.sh --force &> /dev/null
          bash memory_leak.sh $SUFFIX

        # uploading test results is not necessary
  fission:
    #-----------------------------------------------------------------------------
    # Run the 'fission' test for two different compilers.
    #-----------------------------------------------------------------------------
    runs-on: self-hosted
    needs:   compile-mf-nuclei
    strategy:
      matrix:
        COMPILER: [gfortran, ifx]
    env:
      SUFFIX: BXL.${{ matrix.COMPILER }}.NUCLEI.SERIAL
    steps:
      - name: Checkout code # needed to get the testing scripts
        uses: actions/checkout@v6

      - name: Download executable
        uses: actions/download-artifact@v7
        with:
          name: MOCCa.${{ env.SUFFIX }}
          path: exec/

      - name: Make executeable
        # Unfortunately, github artifacts don't retain permissions.
        run:  chmod +x exec/MOCCa.${{ env.SUFFIX }}.exe

      - name: Run fission test
        # Perform the test
        run: |
          cd testing/integration/
          source /opt/intel/oneapi/setvars.sh --force &> /dev/null
          bash fission.sh $SUFFIX

      - name: Upload test results
        # Upload the log files as artefact
        if: success() || failure() # Always upload the code outputs
        uses: actions/upload-artifact@v7
        with:
          name: fission-${{ env.SUFFIX }}
          path: testing/integration/logs/fission.${{ env.SUFFIX }}.out
          retention-days: 90

  boundary_conditions:
    #-----------------------------------------------------------------------------
    # Run the boundary conditions test
    #-----------------------------------------------------------------------------
    runs-on: self-hosted
    needs:   [compile-mf-nuclei, compile-mf-pasta]
    strategy:
      matrix:
        COMPILER:
          - ifx
    env:
      SUFFIX  : BXL.${{ matrix.COMPILER }}.NUCLEI
      N_SUFFIX: BXL.${{ matrix.COMPILER }}.NUCLEI.SERIAL
      P_SUFFIX: BXL.${{ matrix.COMPILER }}.PASTA.SERIAL
    steps:
        # Ensure the testing scripts are available
      - name: Checkout code
        uses: actions/checkout@v6

      # Start by downloading the relevant executable
      - uses: actions/download-artifact@v7
        with:
          name: MOCCa.${{ env.N_SUFFIX }}
          path: exec/
      - name: Download executable for pasta
        uses: actions/download-artifact@v7
        with:
          name: MOCCa.${{ env.P_SUFFIX }}
          path: exec/

      - name: Make the executables executable
        # Unfortunately, github artifacts don't retain permissions.
        run: |
          chmod +x exec/MOCCa.${{ env.N_SUFFIX }}.exe
          chmod +x exec/MOCCa.${{ env.P_SUFFIX }}.exe

      - name: Run boundary conditions test
        # Perform the test
        run: |
          cd testing/integration/
          source /opt/intel/oneapi/setvars.sh --force &> /dev/null
          bash boundary_conditions.sh -p BSkG3_naked -e $N_SUFFIX -f $P_SUFFIX

      - name: Upload test results
        # Upload the log files as artefact
        if: success() || failure() # Always upload the code outputs
        uses: actions/upload-artifact@v7
        with:
          name: boundary_conditions-${{ env.SUFFIX }}.logs
          path: |
            testing/integration/logs/boundary_conditions.${{ env.N_SUFFIX }}.out
            testing/integration/logs/boundary_conditions.${{ env.P_SUFFIX }}.out
          retention-days: 90

  blocking:
    #-----------------------------------------------------------------------------
    # Run the blocking.sh test
    #-----------------------------------------------------------------------------
    runs-on: self-hosted
    needs:   compile-mf-nuclei
    strategy:
      matrix:
        COMPILER:
          - gfortran
    env:
      SUFFIX  : BXL.${{ matrix.COMPILER }}.NUCLEI.SERIAL
      T_SUFFIX: BXL-T.${{ matrix.COMPILER }}.NUCLEI.SERIAL
    steps:
        # Ensure the testing scripts are available
      - name: Checkout code
        uses: actions/checkout@v6

      # Start by downloading the relevant executable
      - uses: actions/download-artifact@v7
        with:
          name: MOCCa.${{ env.SUFFIX }}
          path: exec/
      - name: Download executable for pasta
        uses: actions/download-artifact@v7
        with:
          name: MOCCa.${{ env.T_SUFFIX }}
          path: exec/

      - name: Make the executables executable
        # Unfortunately, github artifacts don't retain permissions.
        run: |
          chmod +x exec/MOCCa.${{ env.SUFFIX }}.exe
          chmod +x exec/MOCCa.${{ env.T_SUFFIX }}.exe

      - name: Run blocking test
        # Perform the test
        run: |
          cd testing/integration/
          source /opt/intel/oneapi/setvars.sh --force &> /dev/null
          bash blocking.sh $SUFFIX $T_SUFFIX

      - name: Upload test results
        # Upload the log files as artefact
        if: success() || failure() # Always upload the code outputs
        uses: actions/upload-artifact@v7
        with:
          name: boundary_conditions-${{ env.SUFFIX }}.logs
          path: |
            testing/integration/logs/blocking_full.out
            testing/integration/logs/blocking_FV.out
            testing/integration/logs/blocking_EFA.out
            testing/integration/logs/blocking_EFA_T.out
          retention-days: 90

  continuation_wf:
    #-----------------------------------------------------------------------------
    # Run the 'continuation_wf' test for both BSkG3 and BSkG5
    #-----------------------------------------------------------------------------
    runs-on: self-hosted
    needs:   compile-mf-nuclei
    strategy:
      matrix:
        COMPILER: [ gfortran      ]
        CONFIG  : [ BXL, BXL-N2LO ]
        include :
          - CONFIG: BXL
            PARAM : BSkG3
          - CONFIG: BXL-N2LO
            PARAM : BSkG5
    env:
      SUFFIX: ${{ matrix.CONFIG }}.${{ matrix.COMPILER }}.NUCLEI.SERIAL
    steps:
      - name: Checkout code # needed to get the testing scripts
        uses: actions/checkout@v6

      - name: Download executable
        uses: actions/download-artifact@v7
        with:
          name: MOCCa.${{ env.SUFFIX }}
          path: exec/

      - name: Make executeable
        # Unfortunately, github artifacts don't retain permissions.
        run:  chmod +x exec/MOCCa.${{ env.SUFFIX }}.exe

      - name: Run continuation_wf test
        # Perform the test
        run: |
          cd testing/integration/
          source /opt/intel/oneapi/setvars.sh --force &> /dev/null
          bash continuation_wf.sh $SUFFIX ${{ matrix.PARAM }}

      - name: Upload test results
        # Upload the log files as artefact
        if: success() || failure() # Always upload the code outputs
        uses: actions/upload-artifact@v7
        with:
          name: continuation_wf-${{ env.SUFFIX }}
          path: |
            testing/integration/logs/continuation_wf.${{ env.SUFFIX }}.out.a
            testing/integration/logs/continuation_wf.${{ env.SUFFIX }}.out.b
          retention-days: 90

  continuation_hdf5:
    #-----------------------------------------------------------------------------
    # Run the 'continuation_wf' test for both BSkG3 and BSkG5
    #-----------------------------------------------------------------------------
    runs-on: self-hosted
    needs:   compile-mf-nuclei
    strategy:
      matrix:
        COMPILER: [ gfortran      ]
        CONFIG  : [ BXL, BXL-N2LO ]
        include :
          - CONFIG: BXL
            PARAM : BSkG3
          - CONFIG: BXL-N2LO
            PARAM : BSkG5
    env:
      SUFFIX: ${{ matrix.CONFIG }}.${{ matrix.COMPILER }}.NUCLEI.SERIAL
    steps:
      - name: Checkout code # needed to get the testing scripts
        uses: actions/checkout@v6

      - name: Download executable
        uses: actions/download-artifact@v7
        with:
          name: MOCCa.${{ env.SUFFIX }}
          path: exec/

      - name: Make executeable
        # Unfortunately, github artifacts don't retain permissions.
        run:  chmod +x exec/MOCCa.${{ env.SUFFIX }}.exe

      - name: Run continuation_wf test
        # Perform the test
        run: |
          cd testing/integration/
          source /opt/intel/oneapi/setvars.sh --force &> /dev/null
          bash continuation_hdf5.sh $SUFFIX ${{ matrix.PARAM }}

      - name: Upload test results
        # Upload the log files as artefact
        if: success() || failure() # Always upload the code outputs
        uses: actions/upload-artifact@v7
        with:
          name: continuation_hdf5-${{ env.SUFFIX }}
          path: |
            testing/integration/logs/continuation_HDF5.${{ env.SUFFIX }}.out.a
            testing/integration/logs/continuation_HDF5.${{ env.SUFFIX }}.out.b
          retention-days: 90

