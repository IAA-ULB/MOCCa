  lattice_energy:
    #---------------------------------------------------------------------------
    # Run the 'lattice-energy' test
    #---------------------------------------------------------------------------
    runs-on: self-hosted
    needs: [compile-mf-nuclei, compile-mf-pasta]
    strategy:
      matrix:
        COMPILER: [ gfortran ] 
        CONFIG:   [ BXL      ]
    env:
      # Uniquely labelling the executables with this environment variable
      SUFFIX_VAC: ${{ matrix.CONFIG }}.${{ matrix.COMPILER }}.NUCLEI.SERIAL
      SUFFIX_PAS: ${{ matrix.CONFIG }}.${{ matrix.COMPILER }}.PASTA.SERIAL

    steps:
      # Ensure the testing scripts are available
