name: 'Install build dependencies'
description: 'Install gfortran, LAPACK, BLAS, HDF5, and Python for MOCCa compilation'

runs:
  using: 'composite'
  steps:
    - name: Install build dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y --no-install-recommends \
            gfortran liblapack-dev libblas-dev \
            libhdf5-dev \
            python3 python3-numpy python3-scipy
      shell: bash
